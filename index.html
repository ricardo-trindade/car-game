<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini GP</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b9e8; font-family: "Segoe UI", Arial, sans-serif; }
  canvas { display: block; }
  .hud { position: fixed; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.7); pointer-events: none; }
  #speed { right: 24px; bottom: 20px; font-size: 56px; font-weight: 700; text-align: right; }
  #speed small { font-size: 20px; font-weight: 400; }
  #laps { left: 24px; top: 18px; font-size: 20px; line-height: 1.5; }
  #laps b { font-size: 28px; }
  #msg { left: 0; right: 0; top: 35%; text-align: center; font-size: 44px; font-weight: 700; }
  #help { left: 24px; bottom: 18px; font-size: 14px; opacity: .9; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #111; color: #fff; font-size: 22px; }
</style>
</head>
<body>
<div id="loading">Carregando carro…</div>
<div class="hud" id="laps">Volta <b id="lap">1</b> / 3<br>Tempo <span id="time">0:00.00</span><br>Melhor <span id="best">--</span></div>
<div class="hud" id="speed"><span id="kmh">0</span> <small>km/h</small></div>
<div class="hud" id="msg"></div>
<div class="hud" id="help">↑/W acelera · ↓/S freia/ré · ←→/AD direção · Espaço freio de mão · R reinicia · F inverte a frente do carro</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const MODEL_ALFA = './2024_alfa_romeo_33_stradale_ice.glb';   // jogador 1
const MODEL_LAMBO = './free_lamborghini_revuelto.glb';        // jogador 2
const TOTAL_LAPS = 3;
const ROAD_W = 16;        // largura da pista
const KERB_W = 1.4;

// ---------- cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b9e8);
scene.fog = new THREE.Fog(0x87b9e8, 150, 700);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 1500);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a6b35, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(120, 200, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 500 });
scene.add(sun, sun.target);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// ---------- pista ----------
const ctrl = [
  [0,-100],[0,0],[0,100],[0,200],[45,262],[125,282],[205,250],[232,182],
  [185,122],[200,62],[285,22],[305,-60],[240,-122],[160,-100],[110,-160],
  [40,-205],[-40,-190],[-62,-140]
].map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const N = 600;
const pts = curve.getSpacedPoints(N).slice(0, N);
const tan = pts.map((p, i) => pts[(i + 1) % N].clone().sub(pts[(i - 1 + N) % N]).setY(0).normalize());
const nor = tan.map(t => new THREE.Vector3(-t.z, 0, t.x)); // esquerda

function ribbon(offA, offB, y, colorFn) {
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N, c = colorFn(i);
    for (const o of [offA, offB]) {
      pos.push(pts[k].x + nor[k].x * o, y, pts[k].z + nor[k].z * o);
      col.push(c.r, c.g, c.b);
    }
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide }));
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// grama
const grassTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#3f8a3a'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#459440'; g.fillRect(0, 0, 32, 64);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(120, 120);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

// área de escape (brita) + asfalto + zebras + linhas
const sand = new THREE.Color(0xc9b887), asphalt = new THREE.Color(0x3a3a3e), white = new THREE.Color(0xffffff), red = new THREE.Color(0xd8211f);
const hw = ROAD_W / 2;
ribbon(-hw - KERB_W - 7, hw + KERB_W + 7, 0.00, () => sand);
ribbon(-hw, hw, 0.03, i => asphalt);
const kerbCol = i => (Math.floor(i / 3) % 2 ? red : white);
ribbon(hw, hw + KERB_W, 0.05, kerbCol);
ribbon(-hw - KERB_W, -hw, 0.05, kerbCol);
ribbon(-hw + 0.3, -hw + 0.7, 0.045, () => white);
ribbon(hw - 0.7, hw - 0.3, 0.045, () => white);

// linha de largada
{
  const c = document.createElement('canvas'); c.width = 128; c.height = 32;
  const g = c.getContext('2d');
  for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) {
    g.fillStyle = (x + y) % 2 ? '#fff' : '#111'; g.fillRect(x * 8, y * 8, 8, 8);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, 3), new THREE.MeshBasicMaterial({ map: t }));
  m.rotation.x = -Math.PI / 2;
  m.position.copy(pts[0]).setY(0.06);
  m.rotation.z = -Math.atan2(tan[0].x, tan[0].z) + Math.PI / 2 * 0; // alinhado abaixo
  m.rotation.set(-Math.PI / 2, 0, 0);
  const holder = new THREE.Group();
  holder.position.copy(pts[0]);
  holder.rotation.y = Math.atan2(tan[0].x, tan[0].z);
  m.position.set(0, 0.06, 0);
  holder.add(m);

  // pórtico
  const mat = new THREE.MeshStandardMaterial({ color: 0x222226, metalness: .5, roughness: .4 });
  const beam = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W + 6, 1.4, 1.2), mat);
  beam.position.y = 8; holder.add(beam);
  for (const s of [-1, 1]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 1), mat);
    p.position.set(s * (hw + 2.6), 4, 0); p.castShadow = true; holder.add(p);
  }
  const sign = new THREE.Mesh(new THREE.BoxGeometry(8, 1.6, 1.3), new THREE.MeshStandardMaterial({ color: 0xd8211f, emissive: 0x551010 }));
  sign.position.y = 8; holder.add(sign);
  scene.add(holder);
}

// arquibancadas, barreiras e árvores (decoração)
const trackDist = (x, z) => { let d = 1e9; for (let i = 0; i < N; i += 2) { const dx = x - pts[i].x, dz = z - pts[i].z; d = Math.min(d, dx * dx + dz * dz); } return Math.sqrt(d); };
{
  const colors = [0xd8211f, 0x1e4fd8, 0xf2c200, 0xffffff];
  for (let i = 0; i < N; i += 50) {
    const side = (i / 50) % 2 ? 1 : -1;
    const p = pts[i], n = nor[i];
    const off = side * (hw + KERB_W + 11);
    const g = new THREE.Mesh(new THREE.BoxGeometry(24, 5, 5), new THREE.MeshStandardMaterial({ color: colors[(i / 50) % 4 | 0] }));
    g.position.set(p.x + n.x * off, 2.5, p.z + n.z * off);
    g.rotation.y = Math.atan2(tan[i].x, tan[i].z) + Math.PI / 2 - Math.PI / 2;
    g.rotation.y = Math.atan2(tan[i].z * -1, tan[i].x) * 0 + Math.atan2(tan[i].x, tan[i].z) - Math.PI / 2;
    g.castShadow = g.receiveShadow = true;
    scene.add(g);
  }
  // barreiras de pneus/guard-rail ao longo da pista
  const rail = (side) => {
    const off = side * (hw + KERB_W + 7.5);
    const geo = new THREE.BoxGeometry(1, 1.1, 3.2);
    const mat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
    const mesh = new THREE.InstancedMesh(geo, mat, N / 2);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    for (let j = 0; j < N / 2; j++) {
      const i = j * 2, p = pts[i], n = nor[i];
      e.set(0, Math.atan2(tan[i].x, tan[i].z), 0); q.setFromEuler(e);
      m.compose(new THREE.Vector3(p.x + n.x * off, 0.55, p.z + n.z * off), q, new THREE.Vector3(1, 1, 1));
      mesh.setMatrixAt(j, m);
      mesh.setColorAt(j, new THREE.Color((j % 6 < 3) ? 0xe8e8e8 : 0xd8211f));
    }
    scene.add(mesh);
  };
  rail(1); rail(-1);
  // árvores
  const trunk = new THREE.CylinderGeometry(.4, .6, 3, 6), leaf = new THREE.ConeGeometry(3, 8, 7);
  const tm = new THREE.MeshStandardMaterial({ color: 0x5a3a1c }), lm = new THREE.MeshStandardMaterial({ color: 0x1f5a2a });
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 220; k++) {
    const x = (rnd() - .3) * 700, z = (rnd() - .4) * 650;
    if (trackDist(x, z) < hw + 22) continue;
    const t = new THREE.Mesh(trunk, tm), l = new THREE.Mesh(leaf, lm);
    const s = .8 + rnd() * .8;
    t.position.set(x, 1.5 * s, z); l.position.set(x, (3 + 4) * s, z);
    t.scale.setScalar(s); l.scale.setScalar(s);
    l.castShadow = true;
    scene.add(t, l);
  }
}

// ---------- carro ----------
const car = new THREE.Group();   // posição + rumo
const pivot = new THREE.Group(); // ajuste do modelo (frente invertida)
car.add(pivot);
scene.add(car);

let flip = false;
function prepCar(root) {
  const holder = new THREE.Group();
  holder.add(root);
  let box = new THREE.Box3().setFromObject(holder);
  let size = box.getSize(new THREE.Vector3());
  if (size.x > size.z) { holder.rotation.y = Math.PI / 2; holder.updateMatrixWorld(true); box = new THREE.Box3().setFromObject(holder); size = box.getSize(new THREE.Vector3()); }
  const s = 4.8 / size.z;
  root.scale.multiplyScalar(s);
  holder.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(holder);
  const c = box.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= box.min.y;
  holder.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return holder;
}

// jogador 1 = Alfa, jogador 2 = Lamborghini; o carro remoto é o outro modelo
const models = {};
function setupCars(myId) {
  const mine = myId === 1 ? 'lambo' : 'alfa', theirs = myId === 1 ? 'alfa' : 'lambo';
  pivot.clear(); ghostPivot.clear();
  pivot.add(models[mine].clone(true));
  ghostPivot.add(models[theirs].clone(true));
}

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder);
const loadCar = url => new Promise((res, rej) => loader.load(url, g => res(prepCar(g.scene)), undefined, rej));
Promise.all([loadCar(MODEL_ALFA), loadCar(MODEL_LAMBO)]).then(([alfa, lambo]) => {
  models.alfa = alfa; models.lambo = lambo;
  document.getElementById('loading').remove();
  start();
}).catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = 'Erro ao carregar o modelo. Abra via servidor local (veja iniciar.bat).';
});

// ---------- física / jogo ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') { if (net.active) { if (net.peer) net.ws.send(JSON.stringify({ t: 'restart' })); } else reset(); }
  if (e.code === 'KeyF') { flip = !flip; pivot.rotation.y = ghostPivot.rotation.y = flip ? Math.PI : 0; }
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

const net = { active: false, id: -1, peer: false, ws: null, lastSend: 0 };
const ghost = new THREE.Group();  // carro do outro jogador
const ghostPivot = new THREE.Group();
ghost.add(ghostPivot); ghost.visible = false; scene.add(ghost);
const gt = { x: 0, z: 0, h: 0, init: false };
const st = { x: 0, z: 0, h: 0, v: 0, steer: 0 };
const state = { lap: 1, lapStart: 0, best: null, started: false, countdown: 0, finished: false, passedHalf: false, lastIdx: 0 };
const $ = id => document.getElementById(id);
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;

function reset() {
  const k = 0, slot = Math.max(net.id, 0);
  const back = 8 + slot * 9, side = net.active ? (slot ? -3.5 : 3.5) : 0;
  st.x = pts[k].x - tan[k].x * back + nor[k].x * side; st.z = pts[k].z - tan[k].z * back + nor[k].z * side;
  st.h = Math.atan2(tan[k].x, tan[k].z); st.v = 0; st.steer = 0;
  Object.assign(state, { lap: 1, best: state.best, started: false, countdown: net.active ? Infinity : 3.5, finished: false, passedHalf: false, lastIdx: N - 8 });
  $('msg').textContent = net.active && !net.peer ? 'Aguardando o outro jogador…' : '';
  $('lap').textContent = 1; $('time').textContent = '0:00.00';
  const f = new THREE.Vector3(Math.sin(st.h), 0, Math.cos(st.h));
  camera.position.set(st.x - f.x * 10, 4, st.z - f.z * 10);
}

function nearest() {
  let bi = 0, bd = 1e12;
  for (let i = 0; i < N; i++) { const dx = st.x - pts[i].x, dz = st.z - pts[i].z, d = dx * dx + dz * dz; if (d < bd) { bd = d; bi = i; } }
  return [bi, Math.sqrt(bd)];
}

const WALL_DIST = hw + KERB_W + 6.5; // encosta nas muretas
const MAX_V = 75, ACCEL = 32, BRAKE = 60, REV_MAX = 15;
const clock = new THREE.Clock();

function update(dt) {
  const up = keys.ArrowUp || keys.KeyW, down = keys.ArrowDown || keys.KeyS;
  const left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD;
  const canDrive = state.started && !state.finished;

  const [idx, dist] = nearest();
  const onGrass = dist > hw + KERB_W + 1.5;
  const maxV = onGrass ? 42 : MAX_V;

  if (canDrive) {
    if (up) st.v += (st.v < 0 ? BRAKE : ACCEL * (1 - Math.max(0, st.v) / (MAX_V * 1.15))) * dt;
    else if (down) st.v -= (st.v > 0 ? BRAKE : ACCEL * .6) * dt;
    else st.v -= Math.sign(st.v) * Math.min(Math.abs(st.v), 8 * dt);
    if (keys.Space) st.v -= Math.sign(st.v) * Math.min(Math.abs(st.v), 70 * dt);
  } else {
    st.v -= Math.sign(st.v) * Math.min(Math.abs(st.v), 30 * dt);
  }
  if (st.v > maxV) st.v -= Math.min(st.v - maxV, (onGrass ? 22 : 20) * dt);
  st.v = Math.max(st.v, -REV_MAX);

  const target = canDrive ? (left ? 1 : 0) - (right ? 1 : 0) : 0;
  st.steer += (target - st.steer) * Math.min(1, dt * 8);
  const av = Math.abs(st.v);
  const rate = 2.4 / (1 + av / 30) * Math.min(1, av / 6);
  st.h += st.steer * rate * Math.sign(st.v) * dt;

  st.x += Math.sin(st.h) * st.v * dt;
  st.z += Math.cos(st.h) * st.v * dt;

  // colisão com as muretas ao redor da pista
  {
    const [wi, wd] = nearest();
    if (wd > WALL_DIST) {
      const nx = (st.x - pts[wi].x) / wd, nz = (st.z - pts[wi].z) / wd;
      st.x = pts[wi].x + nx * WALL_DIST; st.z = pts[wi].z + nz * WALL_DIST;
      const into = Math.abs(Math.sin(st.h) * nx + Math.cos(st.h) * nz); // 1 = de frente na mureta
      st.v *= 1 - 0.75 * into;
    }
  }

  // voltas
  const frac = idx / N;
  if (frac > 0.4 && frac < 0.6) state.passedHalf = true;
  if (canDrive && state.lastIdx > N * 0.85 && idx < N * 0.15 && st.v > 0) {
    if (state.passedHalf) {
      const t = clock.elapsedTime - state.lapStart;
      if (state.best === null || t < state.best) { state.best = t; $('best').textContent = fmt(t); }
      if (state.lap >= TOTAL_LAPS) {
        state.finished = true;
        if (net.active && net.peer) { net.ws.send(JSON.stringify({ t: 'finish', time: t })); $('msg').textContent = '🏁 Terminou!'; }
        else $('msg').textContent = `🏁 Fim! ${fmt(t)} — R para jogar de novo`;
      } else {
        state.lap++; $('lap').textContent = state.lap;
        flash(`Volta ${state.lap}`);
      }
      state.lapStart = clock.elapsedTime; state.passedHalf = false;
    }
  }
  state.lastIdx = idx;

  // contagem inicial
  if (!state.started && isFinite(state.countdown)) {
    state.countdown -= dt;
    const n = Math.ceil(state.countdown);
    $('msg').textContent = state.countdown > 0 ? (n > 3 ? '' : n) : 'VAI!';
    if (state.countdown <= 0) { state.started = true; state.lapStart = clock.elapsedTime; setTimeout(() => { if (state.started) $('msg').textContent = ''; }, 800); }
  }
  if (state.started && !state.finished) $('time').textContent = fmt(clock.elapsedTime - state.lapStart);
  $('kmh').textContent = Math.round(Math.abs(st.v) * 3.6);

  // colisão entre carros (o carro remoto é só visual; cada jogador se afasta dele)
  if (net.active && net.peer && ghost.visible) {
    const dx = st.x - ghost.position.x, dz = st.z - ghost.position.z;
    const d = Math.hypot(dx, dz), R = 3.0;
    if (d < R && d > 0.001) {
      const push = R - d;
      st.x += dx / d * push; st.z += dz / d * push;
      st.v *= 0.8;
    }
  }

  // aplicar ao carro
  car.position.set(st.x, 0, st.z);
  car.rotation.y = st.h;
  pivot.rotation.z = -st.steer * Math.min(1, av / 60) * 0.04; // leve rolagem

  // rede
  if (net.active && net.peer) {
    const now = performance.now();
    if (now - net.lastSend > 33 && net.ws.readyState === 1) {
      net.lastSend = now;
      net.ws.send(JSON.stringify({ t: 's', x: +st.x.toFixed(2), z: +st.z.toFixed(2), h: +st.h.toFixed(3), v: +st.v.toFixed(1) }));
    }
    if (gt.init) {
      const k = 1 - Math.exp(-dt * 15);
      ghost.position.x += (gt.x - ghost.position.x) * k;
      ghost.position.z += (gt.z - ghost.position.z) * k;
      let dh = ((gt.h - ghost.rotation.y + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
      ghost.rotation.y += dh * k;
    }
  }

  // câmera
  const f =new THREE.Vector3(Math.sin(st.h), 0, Math.cos(st.h));
  const back = 8 + av * 0.01;
  const desired = new THREE.Vector3(st.x - f.x * back, 3.4 + av * 0.01, st.z - f.z * back);
  camera.position.lerp(desired, 1 - Math.exp(-dt * 16));
  camera.lookAt(st.x + f.x * 6, 1.2, st.z + f.z * 6);
  camera.fov += ((62 + av * 0.25) - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();

  sun.position.set(st.x + 120, 200, st.z + 80);
  sun.target.position.set(st.x, 0, st.z);
}

let flashT;
function flash(t) { $('msg').textContent = t; clearTimeout(flashT); flashT = setTimeout(() => $('msg').textContent = '', 1200); }

function connect() {
  let opened = false;
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  net.ws = ws;
  ws.onopen = () => { opened = true; net.active = true; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'welcome') {
      net.id = m.id; net.peer = m.peer; ghost.visible = false; gt.init = false;
      setupCars(m.id);
      $('help').textContent = `Você é o Jogador ${m.id + 1} · ` + $('help').textContent;
      reset();
    } else if (m.t === 'peer') {
      net.peer = m.peer; ghost.visible = m.peer; gt.init = false;
      if (!m.peer) reset();
    } else if (m.t === 'start') {
      reset(); state.countdown = 3.5; ghost.visible = true; gt.init = false;
    } else if (m.t === 's') {
      gt.x = m.x; gt.z = m.z; gt.h = m.h;
      if (!gt.init) { gt.init = true; ghost.position.set(m.x, 0, m.z); ghost.rotation.y = m.h; ghost.visible = true; }
    } else if (m.t === 'winner') {
      state.finished = true;
      $('msg').textContent = (m.id === net.id ? '🏆 Você venceu!' : '😢 O outro jogador venceu') + ' — R para revanche';
    } else if (m.t === 'full') {
      net.active = false;
      $('msg').textContent = 'Sala cheia (2 jogadores). Jogando sozinho.';
      reset();
    }
  };
  ws.onclose = () => {
    if (!opened) { net.id = -1; net.active = false; reset(); return; }  // sem servidor: modo solo
    net.active = false; net.peer = false; ghost.visible = false;
    $('msg').textContent = 'Conexão perdida.';
  };
}

function start() {
  setupCars(net.id);
  reset();
  connect();
  renderer.setAnimationLoop(() => {
    update(Math.min(clock.getDelta(), 0.05));
    renderer.render(scene, camera);
  });
}
</script>
</body>
